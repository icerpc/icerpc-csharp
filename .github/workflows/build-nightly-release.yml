name: Build Nightly Release
on:
  schedule:
    # Run every day at 2:00 AM
    - cron: "0 2 * * *"

jobs:
  build-nightly-release:
    if: github.repository == 'icerpc/icerpc-csharp'
    uses: ./.github/workflows/build-release.yml
    permissions:
      contents: read
      actions: read
      # build-release.yml grants id-token: write to its publish-release job, which needs this grant from its caller
      # even though nightly builds don't publish to nuget.org.
      id-token: write
    secrets: inherit
    with:
      channel: nightly
      publish: true
