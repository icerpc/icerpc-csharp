name: .NET

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ["main"]

jobs:
  dotnet-format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Build
        run: dotnet build

      # The build already reports analyzer diagnostics as errors. dotnet format's analyzers pass is skipped because it
      # ignores diagnostic suppressors such as NUnit.Analyzers' nullable suppressor, and fails on code that builds
      # cleanly: https://github.com/dotnet/sdk/issues/50978
      - name: Check whitespace formatting
        run: dotnet format whitespace --verify-no-changes

      - name: Check code style
        run: dotnet format style --verify-no-changes
