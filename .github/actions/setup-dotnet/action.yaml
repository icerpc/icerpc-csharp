name: Setup .NET
description: "Setup .NET and install libmsquic"

inputs:
  cache:
    description: >-
      Whether to restore and save the NuGet global packages folder. The cached folder can hold the packages that
      build/publish-local-packages.sh published, so a job that must restore the IceRpc packages from a NuGet feed
      sets it to false.
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 11.0.x
        dotnet-quality: preview

    - name: Install libmsquic on Linux
      if: runner.os == 'Linux'
      run: |
        wget https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb -O packages-microsoft-prod.deb
        sudo dpkg -i packages-microsoft-prod.deb
        rm packages-microsoft-prod.deb
        sudo apt update
        sudo apt install libmsquic
      shell: bash

    - name: Install libmsquic on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install libmsquic
        echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib" >> $GITHUB_ENV
