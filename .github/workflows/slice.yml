name: "Verify vendored Slice files"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify-vendored-files:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify Slice files match slice.toml
        run: python build/sync-slice.py --verify
