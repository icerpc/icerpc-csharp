name: Setup .NET
description: "Setup .NET and install libmsquic"

runs:
  using: "composite"
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.x

    - name: Install libmsquic on Linux
      if: runner.os == 'Linux'
      run: |
        wget https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb -O packages-microsoft-prod.deb
        sudo dpkg -i packages-microsoft-prod.deb
        rm packages-microsoft-prod.deb
        sudo apt update
        # 2.6.1 fails every QUIC handshake to an IP address (see #4906); pin until a fixed release ships.
        sudo apt install libmsquic=2.6.0
      shell: bash

    - name: Install libmsquic on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        # 2.6.1 fails every QUIC handshake to an IP address (see #4906); pin until a fixed release ships.
        brew tap-new --no-git icerpc/local
        cp "$GITHUB_ACTION_PATH/libmsquic.rb" "$(brew --repository icerpc/local)/Formula/"
        brew install icerpc/local/libmsquic
        echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib" >> $GITHUB_ENV
