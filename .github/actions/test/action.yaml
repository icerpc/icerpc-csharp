name: Run Tests
description: "Runs .NET tests"

runs:
  using: "composite"
  steps:
  - name: 🧪 Test .NET
    run: |
      mkdir -p TestResults
      dotnet test \
        --no-build \
        --verbosity normal \
        --blame \
        --blame-crash \
        --blame-hang-timeout 60s \
        --diag:"TestResults/vstest.log" \
        --logger "trx" \
        --results-directory TestResults \
        -p:SkipQuicTests=true
    shell: bash

  # The QUIC tests run on their own: on Linux, a QUIC listener bound to port 0 can be assigned the UDP port of a QUIC
  # listener in another test host, and then misses the connections sent to that port.
  - name: 🧪 Test .NET (QUIC)
    run: |
      dotnet test tests/IceRpc.Transports.Quic.Tests \
        --no-build \
        --verbosity normal \
        --blame \
        --blame-crash \
        --blame-hang-timeout 60s \
        --diag:"TestResults/vstest-quic.log" \
        --logger "trx" \
        --results-directory TestResults
    shell: bash
    if: success() || failure()

  - name: Create test report
    run: |
      dotnet tool install -g dotnet-trx
      trx --path TestResults
    shell: bash
    if: always()

  - name: Upload blame dumps and logs
    uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
    if: failure()
    with:
      name: blame-and-dumps-${{ runner.os }}
      path: |
        TestResults/**/*.dmp
        TestResults/**/*.xml
        TestResults/**/*.txt
        TestResults/**/*.log
      if-no-files-found: ignore

  - name: Upload test results
    uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
    with:
      name: test-results-${{ runner.os }}
      path: TestResults/*.trx
      if-no-files-found: ignore
    if: always()
